# include template from Ensembl Gitlab CI templates project
include:
  - project: 'ensembl-web/ensembl-gitlab-ci-templates'
    ref: 'main'
    file:
      - 'branch-rules/.branch-rules-template.yaml'
      - 'deploy/.deploy-main-template.yaml'
      - 'security-scan/.ensembl-security-jobs.yaml'

stages:
  - security-scan
  - build
  - container-scan
  - deploy

variables:
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  DOCKER_TLS_CERTDIR: ""

#Build docker image
Docker:
  stage: build
  image: docker
  services:
    - docker:dind
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t ${DOCKER_IMAGE} --no-cache -f Dockerfile .
    - docker push ${DOCKER_IMAGE}
    - docker rmi ${DOCKER_IMAGE}
    - docker logout $CI_REGISTRY

Dev:
  stage: deploy
  extends: .deploy-main
  environment:
    name: development
  variables:
    AGENT: ${DEV_AGENT}
    NS: ${MCP_NS}
