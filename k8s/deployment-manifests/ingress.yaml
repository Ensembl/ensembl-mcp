apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ensembl-mcp-ingress
  namespace: mcp-poc-public
spec:
  ingressClassName: nginx
  rules:
    - host: mcp-poc-public.review.ensembl.org
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: ensembl-mcp-svc
                port:
                  number: 8000