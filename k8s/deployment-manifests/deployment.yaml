apiVersion: apps/v1
kind: Deployment
metadata:
  name: ensembl-mcp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ensembl-mcp
  template:
    metadata:
      labels:
        app: ensembl-mcp
    spec:
      imagePullSecrets:
        - name: ensemblweb-pull-secret
      containers:
        - name: ensembl-mcp
          image: DOCKER_IMAGE
          imagePullPolicy: Always
          stdin: true
          stdinOnce: false
          envFrom:
            - configMapRef:
                name: ensembl-mcp-configmap